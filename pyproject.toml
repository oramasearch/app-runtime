[project]
name = "orama-app-runtime"
version = "0.1.2"
description = "Loads and serves an Orama App from a pinned lake repository revision"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "numpy==2.3.2",
    "packaging==25.0",
    "pandas==2.3.1",
    "plotly==6.2.0",
    "pydantic==2.11.7",
    "streamlit==1.48.1",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
app-runtime = "app_runtime.main:main"

[build-system]
requires = ["uv_build==0.11.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app_runtime", "orama_app"]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-timeout==2.4.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
